services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "6677:6677"
    environment:
      NODE_ENV: production
      PORT: "6677"
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Coolify's "Raw Docker Compose Deployment" does NOT auto-generate Traefik
    # routing for compose services — labels must be set explicitly, or the
    # request never reaches this container and the browser sees /ws stuck
    # "pending" forever. Set APP_DOMAIN in Coolify's environment variables for
    # this resource (e.g. chat.example.com), then redeploy. Traefik forwards
    # WebSocket upgrades automatically once the router below matches — no
    # separate WS config needed.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sync-chat.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.sync-chat.entrypoints=https"
      - "traefik.http.routers.sync-chat.tls=true"
      - "traefik.http.routers.sync-chat.tls.certresolver=letsencrypt"
      - "traefik.http.services.sync-chat.loadbalancer.server.port=6677"

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    labels:
      - "traefik.enable=false"

volumes:
  redis-data:
