services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "6677:6677"
    environment:
      NODE_ENV: production
      PORT: "6677"
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Coolify's "Raw Docker Compose Deployment" does not auto-generate Traefik
    # routing for compose services unless a Domain is assigned to this service
    # in the Coolify UI (Application → this service → Domains). That's the
    # recommended fix and handles HTTPS + WebSocket forwarding automatically.
    # The labels below are a fallback if the UI doesn't pick the service up;
    # they only cover plain HTTP routing per Coolify's documented minimal
    # example — add this service's HTTPS/TLS labels yourself to match your
    # Coolify version if you go this route instead of the UI. Set APP_DOMAIN
    # in this resource's environment variables either way.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sync-chat.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.sync-chat.entrypoints=http"
      - "traefik.http.services.sync-chat.loadbalancer.server.port=6677"

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    labels:
      - "traefik.enable=false"

volumes:
  redis-data:
